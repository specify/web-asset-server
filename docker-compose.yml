services:
  asset-server:
    image: ${ASSET_IMAGE:-specify-assets:local}
    build: .
    restart: unless-stopped
    init: true
    user: '${ASSET_UID:-999}:${ASSET_GID:-999}'
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    volumes:
      - '${ASSET_ATTACHMENTS:-attachments}:/home/specify/attachments'
      - './settings_local.py:/home/specify/settings_local.py:ro'
    ports:
      - '${ASSET_BIND_ADDRESS:-127.0.0.1}:${ASSET_PORT:-8080}:8080'
volumes:
  attachments:
