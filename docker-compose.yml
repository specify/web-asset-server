services:
  asset-server:
    image: ${ASSET_IMAGE:-specify-assets:local}
    build: .
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        - CMD
        - ve/bin/python
        - -c
        - "import urllib.request, xml.etree.ElementTree as ET; r = urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8080/web_asset_store.xml', headers={'User-Agent': 'SpecifyAssetHealthcheck/1.0'}), timeout=3); root = ET.fromstring(r.read()); assert root.tag == 'urls' and len(root.findall('url')) == 5"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    user: '${ASSET_UID:-999}:${ASSET_GID:-999}'
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    volumes:
      - '${ASSET_ATTACHMENTS:-attachments}:/home/specify/attachments'
      - './settings_local.py:/home/specify/settings_local.py:ro'
    ports:
      - '${ASSET_BIND_ADDRESS:-127.0.0.1}:${ASSET_PORT:-8080}:8080'
volumes:
  attachments:
