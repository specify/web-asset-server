# Replace assets.example.edu and certificate paths before installing.
# Include asset-controls.conf in http {} first. Keep existing ACME paths.
server {
    listen 80;
    server_name assets.example.edu;
    location /.well-known/acme-challenge/ { root /var/www; }
    location / { return 308 https://assets.example.edu$request_uri; }
}
server {
    listen 443 ssl;
    server_name assets.example.edu;
    ssl_certificate /etc/letsencrypt/live/assets.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/assets.example.edu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Finite upload ceiling; choose an institution-appropriate value.
    client_max_body_size 512m;
    client_header_timeout 10s;
    client_body_timeout 30s;
    keepalive_timeout 15s;
    send_timeout 60s;
    limit_req zone=asset_requests burst=120 nodelay;
    limit_req zone=asset_metadata burst=6 nodelay;
    limit_req_status 429;
    limit_conn asset_clients 32;
    limit_conn asset_server 64;
    limit_conn asset_uploads 4;
    limit_conn_status 429;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
