# Include in nginx's http {} context, before the asset virtual host.
# Empty keys exempt other paths from their endpoint-specific controls.
map $uri $asset_metadata_key { default ""; /getmetadata $binary_remote_addr; }
map $uri $asset_upload_key { default ""; /fileupload $server_name; }
limit_req_zone $binary_remote_addr zone=asset_requests:10m rate=60r/s;
limit_req_zone $asset_metadata_key zone=asset_metadata:1m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=asset_clients:10m;
limit_conn_zone $server_name zone=asset_server:1m;
limit_conn_zone $asset_upload_key zone=asset_uploads:1m;
